openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: 333 Lives API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: User profile operations
  - name: messages
    description: Future time-locked messages
  - name: vault
    description: Secure document vault
  - name: events
    description: Calendar events and medication reminders
  - name: habits
    description: Daily habits tracking
  - name: intentions
    description: Daily intentions (the 333 method)
  - name: dashboard
    description: Dashboard summary stats
  - name: gratitude
    description: Daily gratitude practice
  - name: people
    description: People in your life — family, friends, loved ones

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateMe
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /messages:
    get:
      operationId: getMessages
      tags: [messages]
      summary: List all future messages
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: [text, audio, video]
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: createMessage
      tags: [messages]
      summary: Create a new future message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageBody"
      responses:
        "201":
          description: Created message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /messages/{id}:
    get:
      operationId: getMessage
      tags: [messages]
      summary: Get a single message
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteMessage
      tags: [messages]
      summary: Delete a message
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /vault:
    get:
      operationId: getVaultItems
      tags: [vault]
      summary: List all vault items
      parameters:
        - in: query
          name: category
          schema:
            type: string
            enum: [document, photo, journal, voice_note, important_info]
      responses:
        "200":
          description: List of vault items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VaultItem"
    post:
      operationId: createVaultItem
      tags: [vault]
      summary: Create a vault item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVaultItemBody"
      responses:
        "201":
          description: Created vault item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultItem"

  /vault/{id}:
    get:
      operationId: getVaultItem
      tags: [vault]
      summary: Get a single vault item
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vault item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteVaultItem
      tags: [vault]
      summary: Delete a vault item
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /events:
    get:
      operationId: getEvents
      tags: [events]
      summary: List all calendar events
      parameters:
        - in: query
          name: type
          schema:
            type: string
            enum: [event, medication, routine]
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CalendarEvent"
    post:
      operationId: createEvent
      tags: [events]
      summary: Create a calendar event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventBody"
      responses:
        "201":
          description: Created event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"

  /events/{id}:
    put:
      operationId: updateEvent
      tags: [events]
      summary: Update a calendar event
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventBody"
      responses:
        "200":
          description: Updated event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEvent"
    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Delete a calendar event
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /habits:
    get:
      operationId: getHabits
      tags: [habits]
      summary: List all habits
      responses:
        "200":
          description: List of habits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Habit"
    post:
      operationId: createHabit
      tags: [habits]
      summary: Create a habit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHabitBody"
      responses:
        "201":
          description: Created habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"

  /habits/{id}:
    put:
      operationId: updateHabit
      tags: [habits]
      summary: Update a habit
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHabitBody"
      responses:
        "200":
          description: Updated habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"
    delete:
      operationId: deleteHabit
      tags: [habits]
      summary: Delete a habit
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /habits/{id}/checkin:
    post:
      operationId: checkInHabit
      tags: [habits]
      summary: Check in a habit for today
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitCheckinBody"
      responses:
        "200":
          description: Check-in recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitCheckin"

  /intentions:
    get:
      operationId: getIntentions
      tags: [intentions]
      summary: List daily intentions
      parameters:
        - in: query
          name: date
          schema:
            type: string
            format: date
          description: Date in YYYY-MM-DD format (defaults to today)
      responses:
        "200":
          description: List of intentions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Intention"
    post:
      operationId: createIntention
      tags: [intentions]
      summary: Create a daily intention
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIntentionBody"
      responses:
        "201":
          description: Created intention
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intention"

  /intentions/{id}:
    put:
      operationId: updateIntention
      tags: [intentions]
      summary: Update an intention (mark complete, edit text)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateIntentionBody"
      responses:
        "200":
          description: Updated intention
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Intention"

  /journal:
    get:
      operationId: getJournalEntries
      tags: [journal]
      summary: List all journal entries
      responses:
        "200":
          description: List of entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntry"
    post:
      operationId: createJournalEntry
      tags: [journal]
      summary: Create a journal entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJournalEntryBody"
      responses:
        "201":
          description: Created entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"

  /journal/today:
    get:
      operationId: getTodayJournalEntry
      tags: [journal]
      summary: Get today's journal entry
      responses:
        "200":
          description: Today's entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /journal/{id}:
    put:
      operationId: updateJournalEntry
      tags: [journal]
      summary: Update a journal entry
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateJournalEntryBody"
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
    delete:
      operationId: deleteJournalEntry
      tags: [journal]
      summary: Delete a journal entry
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /goals:
    get:
      operationId: getGoals
      tags: [goals]
      summary: List all goals
      parameters:
        - in: query
          name: category
          schema:
            type: string
            enum: [personal, financial, health, relationships, career, spiritual]
      responses:
        "200":
          description: List of goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Goal"
    post:
      operationId: createGoal
      tags: [goals]
      summary: Create a goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGoalBody"
      responses:
        "201":
          description: Created goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"

  /goals/{id}:
    put:
      operationId: updateGoal
      tags: [goals]
      summary: Update a goal
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGoalBody"
      responses:
        "200":
          description: Updated goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
    delete:
      operationId: deleteGoal
      tags: [goals]
      summary: Delete a goal
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /affirmations:
    get:
      operationId: getAffirmations
      tags: [affirmations]
      summary: List affirmations
      responses:
        "200":
          description: List of affirmations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Affirmation"
    post:
      operationId: createAffirmation
      tags: [affirmations]
      summary: Create an affirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAffirmationBody"
      responses:
        "201":
          description: Created affirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Affirmation"

  /affirmations/today:
    get:
      operationId: getTodayAffirmation
      tags: [affirmations]
      summary: Get or generate today's affirmation
      responses:
        "200":
          description: Today's affirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Affirmation"

  /affirmations/{id}:
    put:
      operationId: updateAffirmation
      tags: [affirmations]
      summary: Favorite or edit an affirmation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAffirmationBody"
      responses:
        "200":
          description: Updated affirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Affirmation"

  /gratitude:
    get:
      operationId: getGratitudeEntries
      tags: [gratitude]
      summary: List all gratitude entries
      responses:
        "200":
          description: List of gratitude entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GratitudeEntry"
    post:
      operationId: createGratitudeEntry
      tags: [gratitude]
      summary: Create a gratitude entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGratitudeEntryBody"
      responses:
        "201":
          description: Created gratitude entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GratitudeEntry"

  /gratitude/today:
    get:
      operationId: getTodayGratitudeEntry
      tags: [gratitude]
      summary: Get today's gratitude entry
      responses:
        "200":
          description: Today's gratitude entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GratitudeEntry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /gratitude/{id}:
    put:
      operationId: updateGratitudeEntry
      tags: [gratitude]
      summary: Update a gratitude entry
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGratitudeEntryBody"
      responses:
        "200":
          description: Updated gratitude entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GratitudeEntry"
    delete:
      operationId: deleteGratitudeEntry
      tags: [gratitude]
      summary: Delete a gratitude entry
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /people:
    get:
      operationId: getPeople
      tags: [people]
      summary: List all people
      responses:
        "200":
          description: List of people
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Person"
    post:
      operationId: createPerson
      tags: [people]
      summary: Add a person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePersonBody"
      responses:
        "201":
          description: Created person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"

  /people/{id}:
    get:
      operationId: getPerson
      tags: [people]
      summary: Get a person by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updatePerson
      tags: [people]
      summary: Update a person
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePersonBody"
      responses:
        "200":
          description: Updated person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
    delete:
      operationId: deletePerson
      tags: [people]
      summary: Delete a person
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required: [success]

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        avatarUrl:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        streakDays:
          type: integer
        messagesSent:
          type: integer
        goalsActive:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, name, email, streakDays, messagesSent, goalsActive, createdAt]

    UpdateUserBody:
      type: object
      properties:
        name:
          type: string
        bio:
          type: string
        avatarUrl:
          type: string

    Message:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string
          nullable: true
        audioUrl:
          type: string
          nullable: true
        type:
          type: string
          enum: [text, audio, video]
        unlockDate:
          type: string
          format: date-time
        isUnlocked:
          type: boolean
        recipientName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, title, type, unlockDate, isUnlocked, createdAt]

    CreateMessageBody:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        audioUrl:
          type: string
        type:
          type: string
          enum: [text, audio, video]
        unlockDate:
          type: string
          format: date-time
        recipientName:
          type: string
      required: [title, type, unlockDate]

    VaultItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
          enum: [document, photo, journal, voice_note, important_info]
        fileUrl:
          type: string
          nullable: true
        content:
          type: string
          nullable: true
        mimeType:
          type: string
          nullable: true
        sizeBytes:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, name, category, createdAt]

    CreateVaultItemBody:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
          enum: [document, photo, journal, voice_note, important_info]
        fileUrl:
          type: string
        content:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
      required: [name, category]

    CalendarEvent:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        type:
          type: string
          enum: [event, medication, routine]
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
          nullable: true
        isRecurring:
          type: boolean
        recurringPattern:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, title, type, startTime, isRecurring, createdAt]

    CreateEventBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [event, medication, routine]
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        isRecurring:
          type: boolean
        recurringPattern:
          type: string
        color:
          type: string
      required: [title, type, startTime]

    UpdateEventBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [event, medication, routine]
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        isRecurring:
          type: boolean
        recurringPattern:
          type: string
        color:
          type: string

    Habit:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        targetDays:
          type: integer
        currentStreak:
          type: integer
        longestStreak:
