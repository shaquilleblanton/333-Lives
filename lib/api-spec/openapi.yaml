  /messages/{id}/unlock:
    post:
      operationId: unlockMessage
      tags: [messages]
      summary: Reveal a sealed message's content
      description: >-
        Returns the message content only if the unlock date has passed and, when
        set, the correct passcode is supplied. Content is never returned by the
        list or get endpoints for passcode-protected messages.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnlockMessageBody"
      responses:
        "200":
          description: Unlocked message content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnlockedMessage"
        "401":
          description: Missing or incorrect passcode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Still sealed until unlock date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

