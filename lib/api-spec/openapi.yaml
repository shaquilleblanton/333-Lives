components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required: [success]

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        avatarUrl:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        streakDays:
          type: integer
        messagesSent:
          type: integer
        goalsActive:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, name, email, streakDays, messagesSent, goalsActive, createdAt]

    UpdateUserBody:
      type: object
      properties:
        name:
          type: string
        bio:
          type: string
        avatarUrl:
          type: string

    Message:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string
          nullable: true
        audioUrl:
          type: string
          nullable: true
        type:
          type: string
          enum: [text, audio, video]
        unlockDate:
          type: string
          format: date-time
        isUnlocked:
          type: boolean
          description: True only when the content is included (date reached and no passcode).
        dateReached:
          type: boolean
          description: True once the unlock date has passed.
        hasPasscode:
          type: boolean
          description: True if a passcode was set when the message was created.
        requiresPasscode:
          type: boolean
          description: True when the date has passed but a passcode is still required to reveal content.
        recipientName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, title, type, unlockDate, isUnlocked, dateReached, hasPasscode, requiresPasscode, createdAt]

    CreateMessageBody:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        audioUrl:
          type: string
        type:
          type: string
          enum: [text, audio, video]
        unlockDate:
          type: string
          format: date-time
        recipientName:
          type: string
        passcode:
          type: string
          description: Optional secret passcode required to reveal the message after its unlock date.
      required: [title, type, unlockDate]

    UnlockMessageBody:
      type: object
      properties:
        passcode:
          type: string
          description: The secret passcode, required only if the message was sealed with one.

    UnlockedMessage:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        type:
          type: string
          enum: [text, audio, video]
        content:
          type: string
          nullable: true
        audioUrl:
          type: string
          nullable: true
        recipientName:
          type: string
          nullable: true
        unlockDate:
          type: string
          format: date-time
      required: [id, title, type, unlockDate]

    VaultItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        category:
          type: string
          enum: [document, photo, journal, voice_note, important_info]
        fileUrl:
          type: string
          nullable: true
        content:
          type: string
          nullable: true
        mimeType:
          type: string
          nullable: true
        sizeBytes:
          type: integer
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, name, category, createdAt]

    CreateVaultItemBody:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
          enum: [document, photo, journal, voice_note, important_info]
        fileUrl:
          type: string
        content:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
      required: [name, category]

    CalendarEvent:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        type:
          type: string
          enum: [event, medication, routine]
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
          nullable: true
        isRecurring:
          type: boolean
        recurringPattern:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, title, type, startTime, isRecurring, createdAt]

    CreateEventBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [event, medication, routine]
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        isRecurring:
          type: boolean
        recurringPattern:
          type: string
        color:
          type: string
      required: [title, type, startTime]

    UpdateEventBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [event, medication, routine]
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        isRecurring:
          type: boolean
        recurringPattern:
          type: string
        color:
          type: string

    Habit:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        icon:
          type: string
          nullable: true
        targetDays:
          type: integer
        currentStreak:
          type: integer
        longestStreak:
          type: integer
        completionRate:
          type: number
        checkedInToday:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, name, targetDays, currentStreak, longestStreak, completionRate, checkedInToday, createdAt]

    CreateHabitBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        icon:
          type: string
        targetDays:
          type: integer
      required: [name]

    UpdateHabitBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        icon:
          type: string
        targetDays:
          type: integer

    HabitCheckinBody:
      type: object
      properties:
        note:
          type: string
        status:
          type: string
          enum: [great, okay, struggling]
      required: [status]

    HabitCheckin:
      type: object
      properties:
        id:
          type: integer
        habitId:
          type: integer
        date:
          type: string
          format: date
        status:
          type: string
          enum: [great, okay, struggling]
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, habitId, date, status, createdAt]

    Intention:
      type: object
      properties:
        id:
          type: integer
        text:
          type: string
        date:
          type: string
          format: date
        isCompleted:
          type: boolean
        order:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, text, date, isCompleted, order, createdAt]

    CreateIntentionBody:
      type: object
      properties:
        text:
          type: string
        date:
          type: string
          format: date
        order:
          type: integer
      required: [text]

    UpdateIntentionBody:
      type: object
      properties:
        text:
          type: string
        isCompleted:
          type: boolean

    JournalEntry:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        date:
          type: string
          format: date
        content:
          type: string
        mood:
          type: string
          enum: [great, good, okay, rough, struggling]
        affirmation:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, userId, date, content, mood, createdAt, updatedAt]

    CreateJournalEntryBody:
      type: object
      properties:
        date:
          type: string
          format: date
        content:
          type: string
        mood:
          type: string
          enum: [great, good, okay, rough, struggling]
        affirmation:
          type: string
      required: [content]

    UpdateJournalEntryBody:
      type: object
      properties:
        content:
          type: string
        mood:
          type: string
          enum: [great, good, okay, rough, struggling]
        affirmation:
          type: string

    Goal:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        category:
          type: string
          enum: [personal, financial, health, relationships, career, spiritual]
        progress:
          type: integer
        targetDate:
          type: string
          format: date
          nullable: true
        isCompleted:
          type: boolean
        color:
